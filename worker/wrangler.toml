name = "senko-ai"
main = "ai-proxy.js"
compatibility_date = "2025-01-01"
# Переменные, заданные в панели Cloudflare, при заливке из GitHub не стираются
keep_vars = true

# Где выполняется прокси. Gemini и Groq блокируют запросы из ряда стран, а Worker по умолчанию запускается в
# дата-центре рядом с игроком. Закрепляем США: оттуда оба провайдера доступны, и от места игрока это не зависит.
[placement]
region = "aws:us-east-1"

# KV для счётчиков вопросов. Workflow «Deploy AI worker» сам подставляет id KV, подключённого к работающему worker
# (или создаёт senko-ai-LIMITS). Вручную: npx wrangler kv namespace create LIMITS и вставьте id сюда:
[[kv_namespaces]]
binding = "LIMITS"
id = "14350645f5c243118b63ec5d4fa9f3ad"

# Модели Cloudflare (Workers AI): работают без ключей и без блокировок по странам, бесплатно в пределах суточного лимита.
[ai]
binding = "AI"

[vars]
DAILY_PER_USER = "15"
# GEMINI_MODEL = "gemini-flash-latest"
# GROQ_MODEL = "openai/gpt-oss-120b"
# CF_MODEL = "@cf/meta/llama-3.1-8b-instruct"   # модель Cloudflare: полегче и «дешевле» по суточному лимиту
