name: Deploy AI worker

# Заливает ИИ-прокси worker/ai-proxy.js в Cloudflare (запуск вручную: Actions → Deploy AI worker → Run workflow).
# Нужен секрет CLOUDFLARE_API_TOKEN: dash.cloudflare.com → My Profile → API Tokens → Create Token → шаблон «Edit Cloudflare Workers».
# Если у аккаунта Cloudflare несколько учётных записей, добавьте и CLOUDFLARE_ACCOUNT_ID (Workers & Pages → справа Account ID).
# Секреты самого прокси (APP_KEY, ключи ИИ) остаются в Cloudflare, workflow их не трогает.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Залить worker senko-ai
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Не задан секрет CLOUDFLARE_API_TOKEN"; exit 1; fi
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx -y wrangler@4 deploy
