name: Sync laws

on:
  schedule:
    - cron: "5 21 * * *"   # 00:05 по МСК
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-laws
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser deps
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Parse forum
        env:
          FORUM_LOGIN: ${{ secrets.FORUM_LOGIN }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
        run: node scripts/sync-laws.js
      - name: Commit laws.json
        run: |
          git config user.name "laws-bot"
          git config user.email "laws-bot@users.noreply.github.com"
          git add update/laws.json
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "laws: автообновление $(date -u +%F)"
            git push
          fi
