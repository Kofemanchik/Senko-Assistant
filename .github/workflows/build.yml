name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Версия в package.json должна совпадать с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then echo "package.json=$V, тег=$GITHUB_REF_NAME"; exit 1; fi

      # Ключ нужен приложению, чтобы расшифровать законы из update/laws.enc.
      - name: Ключ расшифровки законов
        shell: bash
        env:
          LAWS_KEY: ${{ secrets.LAWS_KEY }}
        run: |
          if [ -z "$LAWS_KEY" ]; then echo "::error::Не задан секрет LAWS_KEY"; exit 1; fi
          node -e 'require("fs").writeFileSync("laws-key.json", JSON.stringify({ key: process.env.LAWS_KEY }))'

      # Ключ доступа приложения к ИИ-прокси (на прокси он задан как APP_KEY).
      - name: Ключ доступа к ИИ
        shell: bash
        env:
          AI_KEY: ${{ secrets.AI_KEY }}
        run: |
          if [ -z "$AI_KEY" ]; then echo "::error::Не задан секрет AI_KEY"; exit 1; fi
          node -e 'require("fs").writeFileSync("ai-key.json", JSON.stringify({ key: process.env.AI_KEY }))'

      - run: npm ci

      - run: npm run dist

      - name: Upload installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Senko-Assistant-Setup
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
