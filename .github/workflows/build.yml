name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз v<версия из package.json> (тег создастся сам). Версия вида 2.5.0-beta.1 выходит бета-версией для тестеров"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Версия в package.json должна совпадать с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then echo "package.json=$V, тег=$GITHUB_REF_NAME"; exit 1; fi

      - name: Версия
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Модель голоса (Vosk, 46 МБ) не лежит в репозитории. Без неё голосовой ввод и рация пишут «модель не найдена»,
      # так было во всех сборках с 2.3.0. Качаем официальную модель, сверяем каждый файл с voice-model/manifest.sha256
      # и пакуем в model.tar.gz с записями папок (без них модель не открывается).
      - name: Кэш модели голоса
        uses: actions/cache@v4
        with:
          path: voice-model/model.tar.gz
          key: voice-model-${{ hashFiles('voice-model/manifest.sha256') }}

      - name: Модель голоса
        shell: bash
        run: |
          M=voice-model/model.tar.gz
          if [ ! -s "$M" ]; then
            mkdir -p vm && cd vm
            curl -fsSL --retry 4 --retry-delay 5 -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
            if command -v unzip >/dev/null; then unzip -q m.zip; else 7z x -y m.zip >/dev/null; fi
            sha256sum -c ../voice-model/manifest.sha256
            L=$(cut -d' ' -f3 ../voice-model/manifest.sha256)
            D=$(for f in $L; do d=$(dirname "$f"); while [ "$d" != "." ]; do echo "$d"; d=$(dirname "$d"); done; done | sort -u)
            tar --format=ustar --owner=0 --group=0 --no-recursion -czf ../$M $D $L
            cd .. && rm -rf vm
          fi
          S=$(wc -c < "$M")
          echo "model.tar.gz: $S байт"
          if [ "$S" -lt 40000000 ]; then echo "::error::Модель голоса не собралась"; exit 1; fi

      - run: npm run dist

      - name: Модель голоса попала в сборку
        shell: bash
        run: |
          F=dist/win-unpacked/resources/voice-model/model.tar.gz
          if [ ! -s "$F" ]; then echo "::error::В сборке нет $F"; exit 1; fi
          echo "в сборке: $(wc -c < "$F") байт"

      # обычная версия даёт latest.yml, бета (2.5.0-beta.1) — beta.yml; служебный файл сборщика в релиз не нужен
      - name: Убрать служебные файлы сборки
        shell: bash
        run: rm -f dist/builder-debug.yml && ls dist

      # С 2.2.1 ключей в программе нет: законы и ИИ идут через сервер. Сборка не пройдёт, если ключ законов попал внутрь.
      - name: Проверка, что ключей нет в сборке
        shell: bash
        env:
          LAWS_KEY: ${{ secrets.LAWS_KEY }}
        run: |
          A=dist/win-unpacked/resources/app.asar
          if [ ! -f "$A" ]; then echo "нет $A, проверка пропущена"; exit 0; fi
          if [ -n "$LAWS_KEY" ] && grep -qaF "$LAWS_KEY" "$A"; then echo "::error::В сборку попал ключ законов"; exit 1; fi
          if grep -qaE '"(laws|ai)-key\.json"' "$A"; then echo "::warning::В сборке упоминается файл ключа"; fi
          echo "ключей в сборке нет"

      - name: Upload installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Senko-Assistant-Setup
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

      # Описание релиза берётся из «Что нового» программы (NEWS в app/index.html)
      - name: Текст релиза
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        shell: bash
        run: node tools/release-notes.js > release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.ver.outputs.v, '-') }}
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
