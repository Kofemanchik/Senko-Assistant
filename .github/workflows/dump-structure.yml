name: Dump law structure

# Диагностика парсера: печатает в аннотации запуска структуру (типы строк, начала заголовков) текстов законов сервера.
# Сами тексты законов не публикуются: они хранятся в репозитории только в зашифрованном виде.
on:
  workflow_dispatch:
    inputs:
      server:
        description: "Номер сервера: 12, 7 или 16"
        default: "7"

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LAWS_KEY: ${{ secrets.LAWS_KEY }}
      SERVER: ${{ inputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Штрафы
        shell: bash
        run: |
          node scripts/dump-fines.js > "$RUNNER_TEMP/f.txt" 2>&1 || { tail -n 20 "$RUNNER_TEMP/f.txt"; exit 1; }
          cat "$RUNNER_TEMP/f.txt"
          split -C 3400 -d "$RUNNER_TEMP/f.txt" "$RUNNER_TEMP/q."
          n=0
          for f in "$RUNNER_TEMP"/q.*; do
            n=$((n+1)); [ $n -gt 10 ] && break
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::notice title=штрафы сервер $SERVER часть $n::$msg"
          done
      - name: Структура (uk)
        shell: bash
        run: |
          # лимиты GitHub: до 10 аннотаций на шаг и ~4 КБ в каждой, поэтому один кодекс на шаг
          KIND=uk node scripts/dump-structure.js > "$RUNNER_TEMP/d.txt" 2>&1 || { tail -n 20 "$RUNNER_TEMP/d.txt"; exit 1; }
          split -C 3400 -d "$RUNNER_TEMP/d.txt" "$RUNNER_TEMP/p."
          n=0
          for f in "$RUNNER_TEMP"/p.*; do
            n=$((n+1)); [ $n -gt 10 ] && break
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::notice title=uk сервер $SERVER часть $n::$msg"
          done
          rm -f "$RUNNER_TEMP"/p.*
      - name: Структура (ak)
        shell: bash
        run: |
          # лимиты GitHub: до 10 аннотаций на шаг и ~4 КБ в каждой, поэтому один кодекс на шаг
          KIND=ak node scripts/dump-structure.js > "$RUNNER_TEMP/d.txt" 2>&1 || { tail -n 20 "$RUNNER_TEMP/d.txt"; exit 1; }
          split -C 3400 -d "$RUNNER_TEMP/d.txt" "$RUNNER_TEMP/p."
          n=0
          for f in "$RUNNER_TEMP"/p.*; do
            n=$((n+1)); [ $n -gt 10 ] && break
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::notice title=ak сервер $SERVER часть $n::$msg"
          done
          rm -f "$RUNNER_TEMP"/p.*
      - name: Структура (dk)
        shell: bash
        run: |
          # лимиты GitHub: до 10 аннотаций на шаг и ~4 КБ в каждой, поэтому один кодекс на шаг
          KIND=dk node scripts/dump-structure.js > "$RUNNER_TEMP/d.txt" 2>&1 || { tail -n 20 "$RUNNER_TEMP/d.txt"; exit 1; }
          split -C 3400 -d "$RUNNER_TEMP/d.txt" "$RUNNER_TEMP/p."
          n=0
          for f in "$RUNNER_TEMP"/p.*; do
            n=$((n+1)); [ $n -gt 10 ] && break
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::notice title=dk сервер $SERVER часть $n::$msg"
          done
          rm -f "$RUNNER_TEMP"/p.*
      - name: Структура (pk)
        shell: bash
        run: |
          # лимиты GitHub: до 10 аннотаций на шаг и ~4 КБ в каждой, поэтому один кодекс на шаг
          KIND=pk node scripts/dump-structure.js > "$RUNNER_TEMP/d.txt" 2>&1 || { tail -n 20 "$RUNNER_TEMP/d.txt"; exit 1; }
          split -C 3400 -d "$RUNNER_TEMP/d.txt" "$RUNNER_TEMP/p."
          n=0
          for f in "$RUNNER_TEMP"/p.*; do
            n=$((n+1)); [ $n -gt 10 ] && break
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::notice title=pk сервер $SERVER часть $n::$msg"
          done
          rm -f "$RUNNER_TEMP"/p.*
