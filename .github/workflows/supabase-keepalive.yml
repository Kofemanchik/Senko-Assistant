# Раз в сутки обращается к базе Supabase, чтобы бесплатный проект не «засыпал» после недели без активности.
# Ключ ниже публичный (publishable): он безопасен и нужен только для вызова функции ping().
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "https://wcjspwailippjmyffkei.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_hsdKNj25gEIXqIxK7Hhr5A_-VberrUG" \
            -H "Content-Type: application/json" -d '{}'
