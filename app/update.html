<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обновление Senko Assistant</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--bg:#F6F3EE;--card:#fff;--tx:#1c1b1a;--mut:#6f6a64;--ac:#ff7a1a;--tr:#e6e0d8}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0B;--card:#151517;--tx:#f3f1ee;--mut:#9a958f;--tr:#2a2a2d}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-app-region:drag}
.box{width:100%;padding:0 36px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:var(--ac);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff}
h1{font-size:19px;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 22px;font-size:13.5px}
.bar{height:12px;border-radius:99px;background:var(--tr);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:var(--ac);transition:width .25s ease}
.pct{margin-top:12px;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.note{margin-top:6px;color:var(--mut);font-size:12.5px}
</style></head><body>
<div class="box">
  <div class="logo">S</div>
  <h1 id="t">Загружается обновление</h1>
  <p class="sub" id="v">Senko Assistant</p>
  <div class="bar"><div class="fill" id="f"></div></div>
  <div class="pct" id="p">0%</div>
  <div class="note" id="n">Не закрывайте программу: окно исчезнет, когда загрузка закончится.</div>
</div>
<script>
function setV(v){document.getElementById("v").textContent="Версия "+v}
function setP(n){n=Math.max(0,Math.min(100,Math.round(n)||0));document.getElementById("f").style.width=n+"%";document.getElementById("p").textContent=n+"%";
 if(n>=100){document.getElementById("t").textContent="Обновление загружено";document.getElementById("n").textContent="Подготовка к установке…"}}
</script></body></html>
