<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Senko Assistant — вход</title>
<style>
:root{--bg:#EDF0F3;--card:#fff;--ink:#16202b;--muted:#5d6b7a;--line:#d5dbe2;--chip:#e6ebf0;--accent:#2f6fed;--accent-ink:#fff;--err:#b3261e;--errbg:#fdecea;--surface:var(--card);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a212a;--ink:#e8edf2;--muted:#9aa8b6;--line:#2b3541;--chip:#232c37;--accent:#5b92ff;--accent-ink:#0b1220;--err:#ffb4ab;--errbg:#3a1d1b}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto}
.wrap{width:100%;max-width:420px;padding:22px 18px 28px}
.brand{text-align:center;margin:6px 0 18px}
.brand h1{margin:0;font-size:24px;letter-spacing:.2px}
.brand span{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 10px;border-radius:8px;font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
form{display:grid;gap:11px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pw{position:relative}
.pw input{padding-right:78px}
.pw button{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:var(--chip);color:var(--ink);padding:5px 9px;border-radius:7px;font:inherit;font-size:12px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13.5px}
.chk input{width:auto}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);font:600 15px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.err{background:var(--errbg);color:var(--err);border-radius:9px;padding:9px 11px;font-size:13.5px}
.hint{color:var(--muted);font-size:12.5px;margin:12px 2px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quit{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>Senko Assistant</h1><span>Majestic RP · законодательство</span></div>
  <div class="card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tLogin" aria-selected="true">Вход</button>
      <button type="button" role="tab" id="tReg" aria-selected="false">Регистрация</button>
    </div>

    <form id="fLogin" autocomplete="off" novalidate>
      <label>Логин<input id="lLogin" maxlength="24" autocomplete="username" autofocus></label>
      <label>Пароль<span class="pw"><input id="lPass" type="password" maxlength="100" autocomplete="current-password"><button type="button" data-eye="lPass">Показать</button></span></label>
      <label class="chk"><input type="checkbox" id="lRem"> Запомнить меня на этом компьютере</label>
      <div class="err" id="lErr" role="alert" hidden></div>
      <button class="btn" id="lBtn" type="submit">Войти</button>
    </form>

    <form id="fReg" autocomplete="off" novalidate hidden>
      <p class="hint" id="regNote" style="margin:0" hidden>Это первый запуск: создайте личный кабинет.</p>
      <label>Логин (латиница, цифры, «_», «.», «-»)<input id="rLogin" maxlength="24" autocomplete="username"></label>
      <div class="row2">
        <label>Пароль<span class="pw"><input id="rPass" type="password" maxlength="100" autocomplete="new-password"></span></label>
        <label>Повтор пароля<input id="rPass2" type="password" maxlength="100" autocomplete="new-password"></label>
      </div>
      <label class="chk"><input type="checkbox" id="rEye"> Показать пароли</label>
      <label>Ник игрока<input id="rNick" maxlength="40" autocomplete="off"></label>
      <label>Статик<input id="rSt" maxlength="12" autocomplete="off"></label>
      <label>Организация<select id="rOrg"></select></label>
      <label id="rOrgOtherW" hidden>Название организации<input id="rOrgOther" maxlength="60" autocomplete="off"></label>
      <label>Роль<select id="rRole"></select></label>
      <label class="chk"><input type="checkbox" id="rRem" checked> Запомнить меня на этом компьютере</label>
      <div id="rLegal"></div>
      <div class="err" id="rErr" role="alert" hidden></div>
      <button class="btn" id="rBtn" type="submit" disabled>Создать кабинет и войти</button>
    </form>
  </div>
  <p class="hint">Аккаунт хранится только на этом компьютере, пароль — в виде хэша. Восстановить забытый пароль нельзя.</p>
  <button type="button" class="quit" id="quit">Закрыть программу</button>
</div>

<script>
/* ===== Senko Assistant: Политика конфиденциальности и Условия пользования =====

  var DOCS = {
    privacy: {
      title: "Политика конфиденциальности",
      updated: "19 октября 2026",
      sections: [

           "Программа создана игроками и не является официальным продуктом Majestic RP или администрации проекта."]],

        ["3. Где хранятся данные",
          ["Все перечисленные данные хранятся только на вашем компьютере: в локальном хранилище приложения, в папке данных программы (аккаунты и резервная копия настроек) и в папке «Документы\Senko Assistant\Пользователи» (файл профиля). Программа не отправляет их на серверы разработчика и не передаёт третьим лицам (текст вопросов к ИИ-помощнику — отдельный случай, он описан в разделе 4).",
           "Если вы удалите данные приложения или переустановите систему без переноса папки данных, информация будет утрачена. Резервную копию можно сохранить, скопировав папку данных программы."]],
        ["4. Сетевые обращения",
          ["Программа обращается к интернету для проверки и загрузки обновлений (через GitHub) и, если вы включите соответствующие функции, для получения актуальных текстов законодательства с форума проекта. В этих запросах не передаются ваши логин, пароль, ник и иные личные данные.",

           "Если вы пользуетесь ИИ-помощником, текст вашего вопроса и найденные в памятке выдержки из законов отправляются на сервер-посредник (Cloudflare) и далее внешнему ИИ-провайдеру (например, Google Gemini или Groq) для формирования ответа. Вместе с вопросом передаются только анонимный идентификатор установки и IP-адрес (для дневного лимита); логин, пароль, ник, статик и иные данные аккаунта не передаются. Не указывайте в вопросах личные данные. Провайдеры бесплатных тарифов могут хранить запросы и использовать их для улучшения своих сервисов согласно собственным условиям. Если вы задаёте вопрос голосом, на сервер уходит только уже распознанный текст, но не звук."]],
        ["5. Аналитика, реклама, cookie",
          ["Программа не содержит рекламы, счётчиков, аналитики и средств отслеживания. Данные не продаются и не используются для профилирования."]],
        ["6. Ваши права",
          ["Вы можете в любой момент изменить или удалить свои данные: очистить историю в личном кабинете, выйти из аккаунта, удалить приложение и его папку данных. После удаления папки данных восстановить информацию невозможно.",
           "Храните пароль в секрете. Не используйте в Программе пароль, который вы применяете на других сайтах и сервисах."]],
        ["7. Изменения Политики",
          ["Текст Политики может обновляться вместе с версиями Программы. Актуальная редакция всегда доступна в Программе: Настройки → Документы."]],
        ["8. Контакты",
          ["Вопросы и предложения по обработке данных: " + CONTACT + "."]]
      ]
    },
    terms: {
      title: "Условия пользования",
      updated: "19 октября 2026",
      sections: [
        ["1. Принятие условий",
          ["Регистрируясь в Senko Assistant и используя Программу, вы подтверждаете, что прочитали эти Условия и Политику конфиденциальности и согласны с ними. Если вы не согласны, не используйте Программу."]],
        ["2. Назначение Программы",
          ["Программа — бесплатный справочный инструмент: памятка по законодательству проекта Majestic RP Boston, калькулятор сроков и штрафов, помощники для сотрудников. Она предназначена только для игровых целей внутри проекта."]],
        ["3. Неофициальный характер и точность данных",
          ["Программа не связана с Majestic RP и не является официальным источником. Тексты законов приведены для удобства и могут отставать от актуальной редакции или содержать ошибки.",
           "При расхождении приоритет всегда имеет официальный текст на форуме проекта. Разработчик не несёт ответственности за последствия решений, принятых только на основании данных Программы, включая игровые наказания, жалобы и иски."]],
        ["4. Правила использования",
          ["Запрещается: взламывать или модифицировать Программу с целью обхода ограничений; распространять изменённые копии под видом оригинала; использовать Программу для нарушения правил проекта или причинения вреда другим игрокам; выдавать себя за другого человека при регистрации.",
           "Вы отвечаете за достоверность данных, которые указываете, и за сохранность своего пароля."]],
        ["5. Права на программу",
          ["Программа и её оформление принадлежат её автору. Материалы и названия, принадлежащие проекту Majestic RP и его правообладателям, используются исключительно в информационных целях и остаются собственностью их владельцев.",
           "Бесплатное использование не означает передачи прав на исходный код. Копирование и перепродажа Программы без согласия автора запрещены."]],
        ["6. Отсутствие гарантий",
          ["Программа предоставляется «как есть», без каких-либо гарантий бесперебойной работы. Автор вправе изменять, приостанавливать или прекращать развитие Программы, а также выпускать обновления, в том числе принудительные."]],
        ["7. Ограничение ответственности",
          ["В пределах, допустимых законом, автор не отвечает за потерю данных, сбои в работе, а также за любые убытки или игровые последствия, возникшие из-за использования или невозможности использования Программы."]],
        ["8. Изменение Условий и контакты",
          ["Условия могут изменяться. Актуальная редакция всегда доступна в Программе: Настройки → Документы. Продолжая пользоваться Программой после обновления, вы принимаете новую редакцию.",
           "Связь с автором: " + CONTACT + "."]]
      ]
    }
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- стили ---------- */
  var css =
    ".sl-ov{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,10,18,.6)}" +
    ".sl-ov[hidden]{display:none}" +
    ".sl-box{display:flex;flex-direction:column;width:min(640px,100%);max-height:min(82vh,720px);background:var(--surface,#fff);color:var(--ink,#172230);border:1px solid var(--line,#D3D9E0);border-radius:10px;box-shadow:0 16px 48px rgba(0,0,0,.4);font:14px/1.55 var(--f-body,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif);outline:none}" +
    ".sl-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line,#D3D9E0)}" +
    ".sl-tabs{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}" +
    ".sl-tab,.sl-x,.sl-ok{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line,#D3D9E0);background:var(--surface,#fff);border-radius:6px;padding:6px 12px}" +
    ".sl-tab{font-weight:600;font-size:13px}" +
    ".sl-tab[aria-selected=true]{background:var(--accent,#1D4E89);color:var(--accent-ink,#fff);border-color:var(--accent,#1D4E89)}" +
    ".sl-x{padding:6px 10px;line-height:1}" +
    ".sl-body{overflow:auto;padding:14px 18px 6px;flex:1;-webkit-overflow-scrolling:touch}" +
    ".sl-body h2{margin:0 0 2px;font-size:18px}" +
    ".sl-body .sl-upd{margin:0 0 12px;color:var(--muted,#5B6877);font-size:12px}" +
    ".sl-body h3{margin:16px 0 4px;font-size:14px}" +
    ".sl-body p{margin:0 0 8px}" +
    ".sl-foot{display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line,#D3D9E0)}" +
    ".sl-ok{background:var(--accent,#1D4E89);color:var(--accent-ink,#fff);border-color:var(--accent,#1D4E89);font-weight:600}" +
    ".sl-tab:focus-visible,.sl-x:focus-visible,.sl-ok:focus-visible,.sl-link:focus-visible{outline:2px solid var(--accent,#1D4E89);outline-offset:2px}" +
    ".sl-consent{color:var(--ink,#172230);display:flex;align-items:flex-start;gap:9px;margin:10px 0;font-size:13px;line-height:1.45;cursor:pointer}" +
    ".sl-consent input{padding:0;margin:2px 0 0;width:17px;height:17px;flex:0 0 auto;accent-color:var(--accent,#1D4E89);cursor:pointer}" +
    ".sl-link{all:unset;color:var(--accent,#1D4E89);text-decoration:underline;cursor:pointer}" +
    ".sl-consent.sl-err{outline:2px solid #B3261E;outline-offset:3px;border-radius:4px}" +
    "@keyframes slShake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}" +
    ".sl-consent.sl-err{animation:slShake .3s}" +
    "@media (prefers-reduced-motion:reduce){.sl-consent.sl-err{animation:none}}";

  function ensureCss() {
    if (document.getElementById("sl-style")) return;
    var st = document.createElement("style");
    st.id = "sl-style";
    st.textContent = css;
    (document.head || document.documentElement).appendChild(st);
  }

  /* ---------- модальное окно ---------- */
  var ov = null, cur = "privacy", lastFocus = null, tabsEl, bodyEl;

  function renderDoc() {
    var d = DOCS[cur];
    var h = '<h2>' + esc(d.title) + '</h2><p class="sl-upd">Редакция от ' + esc(d.updated) + '</p>';
    d.sections.forEach(function (s) {
      h += "<h3>" + esc(s[0]) + "</h3>";
      s[1].forEach(function (p) { h += "<p>" + esc(p) + "</p>"; });
    });
    bodyEl.innerHTML = h;
    bodyEl.scrollTop = 0;
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.setAttribute("aria-selected", b.getAttribute("data-doc") === cur ? "true" : "false");
    });
  }

  function build() {
    ensureCss();
    ov = document.createElement("div");
    ov.className = "sl-ov";
    ov.hidden = true;
    ov.innerHTML =
      '<div class="sl-box" role="dialog" aria-modal="true" aria-label="Юридические документы" tabindex="-1">' +
      '<div class="sl-head"><div class="sl-tabs" role="tablist">' +
      '<button type="button" class="sl-tab" role="tab" data-doc="privacy">Конфиденциальность</button>' +
      '<button type="button" class="sl-tab" role="tab" data-doc="terms">Условия пользования</button>' +
      '</div><button type="button" class="sl-x" aria-label="Закрыть">✕</button></div>' +
      '<div class="sl-body"></div>' +
      '<div class="sl-foot"><button type="button" class="sl-ok">Закрыть</button></div></div>';
    document.body.appendChild(ov);
    tabsEl = ov.querySelector(".sl-tabs");
    bodyEl = ov.querySelector(".sl-body");
    ov.addEventListener("click", function (e) {
      if (e.target === ov) return close();
      var b = e.target.closest ? e.target.closest("button") : null;
      if (!b) return;
      if (b.classList.contains("sl-x") || b.classList.contains("sl-ok")) return close();
      var d = b.getAttribute("data-doc");
      if (d && DOCS[d]) { cur = d; renderDoc(); }
    });
    ov.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); close(); return; }
      if (e.key === "Tab") { // простая ловушка фокуса внутри окна
        var f = ov.querySelectorAll("button");
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }, true);
  }

  function open(kind) {
    if (!DOCS[kind]) kind = "privacy";
    if (!ov) build();
    cur = kind;
    lastFocus = document.activeElement;
    renderDoc();
    ov.hidden = false;
    var box = ov.querySelector(".sl-box");
    if (box) box.focus();
  }

  function close() {
    if (!ov) return;
    ov.hidden = true;
    try { if (lastFocus && lastFocus.focus) lastFocus.focus(); } catch (e) {}
  }

  /* ---------- галочка согласия для регистрации ---------- */
  function consentHtml(id) {
    id = id || "slAgree";
    return '<label class="sl-consent" data-sl-consent>' +
      '<input type="checkbox" id="' + esc(id) + '" data-sl-check>' +
      '<span>Я ознакомился и согласен с ' +
      '<button type="button" class="sl-link" data-legal="privacy">Политикой конфиденциальности</button> и ' +
      '<button type="button" class="sl-link" data-legal="terms">Условиями пользования</button></span></label>';
  }

  // Делегирование: любая кнопка с data-legal открывает окно (работает и после перерисовки интерфейса).
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest("[data-legal]") : null;
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();
    open(b.getAttribute("data-legal"));
  }, true);

  function bind(root) {
    ensureCss();
    root = root || document;
    var cb = root.querySelector("[data-sl-check]");
    var wrap = root.querySelector("[data-sl-consent]");
    var subs = [];
    if (cb) cb.addEventListener("change", function () {
      if (wrap) wrap.classList.remove("sl-err");
      subs.forEach(function (f) { try { f(cb.checked); } catch (e) {} });
    });
    return {
      checked: function () { return !!(cb && cb.checked); },
      onChange: function (f) { if (typeof f === "function") subs.push(f); },
      shake: function () {
        if (!wrap) return;
        wrap.classList.remove("sl-err");
        void wrap.offsetWidth;
        wrap.classList.add("sl-err");
        if (cb) cb.focus();
      },
      version: VERSION
    };
  }

  window.SenkoLegal = { VERSION: VERSION, open: open, close: close, consentHtml: consentHtml, bind: bind, docs: DOCS };
})();

</script>

<script>
(function(){
  var A=window.senkoAuth, $=function(i){return document.getElementById(i)};
  var tL=$("tLogin"), tR=$("tReg"), fL=$("fLogin"), fR=$("fReg");

  function tab(reg){
    tL.setAttribute("aria-selected",String(!reg)); tR.setAttribute("aria-selected",String(reg));
    fL.hidden=reg; fR.hidden=!reg;
    var f=reg?$("rLogin"):$("lLogin"); if(f) f.focus();
  }
  tL.onclick=function(){tab(false)}; tR.onclick=function(){tab(true)};
  $("quit").onclick=function(){A&&A.quit()};

  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-eye]"); if(!b) return;
    var i=$(b.dataset.eye); var show=i.type==="password";
    i.type=show?"text":"password"; b.textContent=show?"Скрыть":"Показать";
  });
  $("rEye").onchange=function(){var t=this.checked?"text":"password"; $("rPass").type=t; $("rPass2").type=t};

  function showErr(id,msg){var e=$(id); e.textContent=msg||""; e.hidden=!msg}
  function fill(sel,items,first){
    sel.innerHTML=""; if(first){var o=document.createElement("option"); o.value=""; o.textContent=first; sel.appendChild(o)}
    items.forEach(function(it){var o=document.createElement("option"); o.value=it[0]; o.textContent=it[1]; sel.appendChild(o)});
  }

  if(!A){ showErr("lErr","Окно входа открыто вне программы."); return }

  A.state().then(function(s){
    if(!s) return;
    fill($("rOrg"),s.depts.map(function(d){return [d,d]}).concat([["other","Другая организация"]]),"Выберите организацию");
    fill($("rRole"),Object.keys(s.roles).map(function(k){return [k,s.roles[k]]}));
    if(!s.hasUsers){ tab(true); $("regNote").hidden=false }
  });
  $("rOrg").onchange=function(){ $("rOrgOtherW").hidden=this.value!=="other" };

  // Согласие с документами: кнопка регистрации активна только с галочкой
  var rLegal=$("rLegal"); rLegal.innerHTML=SenkoLegal.consentHtml("rAgree");
  var LG=SenkoLegal.bind(rLegal);
  LG.onChange(function(on){ $("rBtn").disabled=!on });

  fL.addEventListener("submit",function(e){
    e.preventDefault(); showErr("lErr","");
    var login=$("lLogin").value.trim(), pass=$("lPass").value;
    if(!login||!pass){showErr("lErr","Введите логин и пароль.");return}
    $("lBtn").disabled=true;
    A.login({login:login,password:pass,remember:$("lRem").checked}).then(function(r){
      if(!r.ok){showErr("lErr",r.error); $("lBtn").disabled=false; $("lPass").select()}
    },function(){showErr("lErr","Ошибка связи с программой."); $("lBtn").disabled=false});
  });

  fR.addEventListener("submit",function(e){
    e.preventDefault(); showErr("rErr","");
    if(!LG.checked()){LG.shake();showErr("rErr","Подтвердите ознакомление с Политикой конфиденциальности и Условиями пользования.");return}
    if($("rPass").value!==$("rPass2").value){showErr("rErr","Пароли не совпадают.");return}
    if(!$("rOrg").value){showErr("rErr","Выберите организацию.");return}
    $("rBtn").disabled=true;
    A.register({
      login:$("rLogin").value.trim(), password:$("rPass").value,
      nick:$("rNick").value.trim(), static:$("rSt").value.trim(),
      org:$("rOrg").value, orgOther:$("rOrgOther").value.trim(),
      role:$("rRole").value, remember:$("rRem").checked,
      legal:{accepted:LG.checked(), version:SenkoLegal.VERSION}
    }).then(function(r){
      if(!r.ok){showErr("rErr",r.error); $("rBtn").disabled=!LG.checked()}
    },function(){showErr("rErr","Ошибка связи с программой."); $("rBtn").disabled=!LG.checked()});
  });
})();
</script>
</body>
