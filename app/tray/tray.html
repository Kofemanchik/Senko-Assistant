<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Senko Assistant — меню</title>
<style>
  :root { --bg: #141416; --ink: #f2f2f3; --muted: #9b9ba4; --line: rgba(255,255,255,.09); --hover: rgba(255,255,255,.06); --ac: #ff8a3d; --ac-ink: #140a03; --soft: rgba(255,138,61,.14); --sw: #3a3a41; --bad: #ff6b6b; }
  html.light { --bg: #ffffff; --ink: #1f1a15; --muted: #6b625a; --line: #ece6dd; --hover: #f4efe8; --ac: #c2530e; --ac-ink: #fff; --soft: #fcefe5; --sw: #d9d2c8; --bad: #c62828; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #box { margin: 8px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.2); overflow: hidden; animation: up .14s ease-out; }
  @keyframes up { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  .hd { display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px; }
  .lg { width: 34px; height: 34px; border-radius: 9px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px var(--line); }
  .lg svg { display: block; width: 100%; height: 100%; }
  .hd b { display: block; font-size: 14px; font-weight: 650; }
  .hd small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;  }
  .hd > span:not(.lg) { min-width: 0; flex: 1; }
  .main { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 10px 8px; width: calc(100% - 20px); height: 36px; border: 0; border-radius: 10px; background: var(--ac); color: var(--ac-ink); font: 600 13.5px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  .main:hover { filter: brightness(1.06); }
  .main svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sec { border-top: 1px solid var(--line); padding: 6px; }
  .it { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; font: 13.5px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  .it:hover, .it:focus-visible { background: var(--hover); outline: none; }
  .it > svg { width: 17px; height: 17px; flex: none; stroke: var(--muted); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .it .t { flex: 1; min-width: 0; }
  .it .t small { display: block; font: 11px "Cascadia Mono", Consolas, monospace; color: var(--muted); margin-top: 1px; }
  .sw { position: relative; width: 30px; height: 18px; border-radius: 9px; background: var(--sw); flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .it[aria-checked="true"] .sw { background: var(--ac); }
  .it[aria-checked="true"] .sw::after { transform: translateX(12px); }
  .seg { display: flex; gap: 2px; margin: 2px 8px 6px 35px; padding: 2px; border-radius: 8px; background: var(--hover); }
  .seg button { flex: 1; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: 600 12px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .lab { padding: 6px 8px 2px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .ft { display: flex; gap: 6px; border-top: 1px solid var(--line); padding: 8px; }
  .ft button { flex: 1; white-space: nowrap; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--ink); font: 600 12.5px "Segoe UI", system-ui, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .ft button:hover { background: var(--hover); }
  .ft button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ft .q { color: var(--bad); }
  .ft .q:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2fbf71; display: inline-block; margin-right: 5px; vertical-align: 1px; }
  .dot.off { background: var(--muted); }
</style>
</head>

    h += '<button type="button" class="main" data-k="toggle">' + ic(S.visible ? "hide" : "open") + (S.visible ? 'Свернуть в трей' : 'Открыть Senko Assistant') + '</button>';
    h += '<div class="sec">' + tog("alwaysOnTop", "pin", "Поверх всех окон", S.alwaysOnTop) + tog("compact", "compact", "Компактный режим", S.compact) +
      tog("mini", "mini", "Мини-окно задержания", S.mini, S.miniHotkey) + (S.radioEnabled ? tog("radio", "radio", "Рация диспетчера", S.radio, S.radioHotkey) : '') + tog("voiceEnabled", "mic", "Голосовой ввод", S.voiceEnabled, S.voiceHotkey) + '</div>';
    if (S.profiles && S.profiles.length) h += '<div class="sec"><div class="lab">Профиль окна</div><div class="seg">' + S.profiles.map(function (p) { return '<button type="button" data-k="profile" data-v="' + esc(p.k) + '" aria-pressed="' + !!p.on + '">' + esc(p.n) + '</button>'; }).join("") + '</div></div>';
    h += '<div class="sec">' + (S.staff ? act("staff", "users", "Список сотрудников") : '') + act("update", "upd", "Проверить обновления") + act("about", "info", "О программе") + '</div>';
    h += '<div class="ft">' + (u ? '<button type="button" data-k="logout" title="Выйти из аккаунта ' + esc(u.login) + '">' + ic("out") + 'Сменить аккаунт</button>' : '') + '<button type="button" class="q" data-k="quit">' + ic("power") + 'Выход</button></div>';
    box.innerHTML = h;
    requestAnimationFrame(function () { api.fit(box.getBoundingClientRect().height + 16); });
  }
  box.addEventListener("click", function (e) {
    var b = e.target.closest("[data-k]"); if (!b) return;
    var k = b.dataset.k;
    if (b.hasAttribute("aria-checked")) { var on = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", String(on)); api.act(k, on); return; }
    api.act(k, b.dataset.v);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { api.close(); return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    var L = [].slice.call(box.querySelectorAll("button")), i = L.indexOf(document.activeElement);
    L[(i + (e.key === "ArrowDown" ? 1 : -1) + L.length) % L.length].focus();
  });
  api.onState(function (d) { S = d || {}; render(); });
  render();
})();
</script>
</body>
</html>
