  .bar .lg svg { display: block; width: 100%; height: 100%; }
  .bar .t { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x { -webkit-app-region: no-drag; width: 30px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s, transform .1s; }
  .x:hover { background: var(--hover); color: var(--ink); }
  .x:active { transform: scale(.92); }
  .x svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .bd { display: flex; gap: 14px; padding: 12px 20px 4px; }
  .ic { width: 42px; height: 42px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--soft); color: var(--ac); animation: pop .32s cubic-bezier(.2,.9,.3,1.4) .06s both; }
  .ic.warning, .ic.error { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .ic.app { background: none; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
  .ic.app svg { width: 100%; height: 100%; display: block; }
  .ic svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .tx { min-width: 0; flex: 1; padding-top: 1px; }
  .msg { font-size: 15.5px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
  .det { margin-top: 6px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; max-height: 300px; overflow: auto; }
  .rows { margin-top: 10px; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .row { display: flex; gap: 12px; padding: 7px 11px; font-size: 13px; animation: slide .26s ease-out both; }
  .row + .row { border-top: 1px solid var(--line); }
  .row span { color: var(--muted); flex: none; width: 128px; }
  .row b { font-weight: 600; min-width: 0; overflow-wrap: anywhere; user-select: text; }
  @keyframes slide { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  .ft { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 16px 20px 18px; }
  .ft button { height: 36px; padding: 0 14px; white-space: nowrap; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--ink); font: 600 13px "Segoe UI", system-ui, sans-serif; cursor: pointer; transition: background .15s, border-color .15s, filter .15s, transform .1s, box-shadow .15s; }
  .ft button:hover { background: var(--hover); }
  .ft button:active { transform: scale(.96); }
  .ft button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--soft); }
  .ft button.main { background: var(--ac); border-color: var(--ac); color: var(--ac-ink); }
  .ft button.main:hover { filter: brightness(1.07); }
  @media (prefers-reduced-motion: reduce) { #box, .ic, .row { transition: none !important; animation: none !important; } }
