<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Senko Voice</title>
<style>
  :root { --a: .8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: #f2f5fa; }
  #panel { display: none; margin: 8px; padding: 12px 14px; border-radius: 16px;
    background: rgba(14, 18, 26, var(--a)); border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #panel.on { display: block; }
  .head { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #8a93a5; flex: none; }
  /* панель управления: перетаскивание и режим. Прозрачность и выключение с 2.3 — в настройках программы */
  .tools { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,.1); font-size: 12px; color: #9aa4b8; }
  .grip { flex: 1; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px; border-radius: 8px; cursor: grab; }
  .grip:hover, .grip.drag { background: rgba(255,255,255,.08); color: #cfd6e4; }
  .grip.drag { cursor: grabbing; }
  .tools svg { display: block; flex: none; }
  .op { display: flex; align-items: center; gap: 6px; }
  #op { -webkit-appearance: none; appearance: none; width: 90px; height: 4px; margin: 0; border-radius: 2px;
    background: rgba(255,255,255,.28); outline: none; cursor: pointer; }
  #op::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #8fb4ff; border: 2px solid #0e121a; }
  #opv { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .pwr { display: flex; align-items: center; justify-content: center; width: 30px; height: 26px; padding: 0;
    border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
    color: #3ddc97; cursor: pointer; }
  .pwr:hover { background: rgba(255,255,255,.16); }
  .pwr.off { color: #ff7a59; }
  .mode { display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #cfd6e4;
    font: 600 12px "Segoe UI", system-ui, sans-serif; cursor: pointer; white-space: nowrap; }
  .mode:hover { background: rgba(255,255,255,.16); }
  .mode.ai { background: rgba(143,180,255,.24); border-color: rgba(143,180,255,.65); color: #c6d9ff; }
  .mode:disabled { opacity: .45; cursor: default; }
  .aians { padding: 9px 11px; border-radius: 10px; background: rgba(143,180,255,.12); font-size: 13.5px; color: #eef2fb;
    white-space: pre-wrap; word-break: break-word; max-height: calc(100vh - 210px); overflow: hidden; }
  .srcs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: #9aa4b8; }
  .srcs .chip { margin: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(255,255,255,.1); color: #cfd6e4; }
  .listening .dot { background: #ff4d5e; animation: pulse 1.1s infinite; }
  .loading .dot, .thinking .dot { background: #ffb84d; animation: blink .9s infinite; }
  .answer .dot { background: #3ddc97; }
  .error .dot { background: #ff7a59; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,94,.7); } 100% { box-shadow: 0 0 0 10px rgba(255,77,94,0); } }
  @keyframes blink { 50% { opacity: .35; } }
  #title { flex: 1; }
  #bars { display: none; align-items: center; gap: 3px; height: 20px; }
  .listening #bars { display: flex; }
  #bars i { display: block; width: 4px; height: 4px; border-radius: 2px; background: #ff8a96; transition: height .08s; }
  #said { margin-top: 8px; color: #cfd6e4; font-size: 13px; min-height: 0; word-break: break-word; }
  #said:empty { display: none; }
  #said b { color: #fff; font-weight: 600; }
  #res { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 150px); overflow: hidden; }
  .card { padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.07); }
  .card.go, .srcs .chip.go { cursor: pointer; }
  .card.go:hover { background: rgba(143,180,255,.18); box-shadow: inset 0 0 0 1px rgba(143,180,255,.55); }
  .srcs .chip.go:hover { background: rgba(143,180,255,.3); }
  .card .open { float: right; margin-left: 6px; font-size: 11.5px; color: #8fb4ff; }
  .card h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .card h4 .k { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 6px; background: rgba(255,255,255,.16); font-size: 12px; }
  .part { margin-top: 4px; font-size: 13px; color: #dfe5f1; }
  .part .pn { color: #8fb4ff; font-weight: 600; margin-right: 4px; }
  .chip { display: inline-block; margin: 3px 4px 0 0; padding: 1px 7px; border-radius: 8px; background: rgba(61,220,151,.18); color: #7ff0bd; font-size: 12px; }
  .ref { padding: 6px 10px; border-radius: 10px; background: rgba(143,180,255,.14); font-size: 13px; }
  .more { font-size: 12px; color: #9aa4b8; }
  #foot { margin-top: 8px; font-size: 12px; color: #8a93a5; }
  #foot:empty { display: none; }
</style>
</head>
<body>
<div id="panel">
  <div class="tools" id="tools">
    <div class="grip" id="grip" title="Перетащить мышкой (двойной щелчок — вернуть на место)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg>
      <span>Senko</span>
    </div>
    <button type="button" class="mode" id="mode" title="Режим: поиск по памятке">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9L18 15z"/></svg>
      <span id="modeT">Поиск</span>
    </button>
  </div>
  <div class="head"><span class="dot"></span><span id="title"></span><span id="bars"><i></i><i></i><i></i><i></i><i></i></span></div>
  <div id="said"></div>
  <div id="res"></div>
  <div id="foot"></div>
</div>
<script src="vosk.js"></script>
<script src="numbers.js"></script>
<script src="overlay.js"></script>
</body>
</html>
